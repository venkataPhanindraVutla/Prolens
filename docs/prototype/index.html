<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro Photo Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/viewfinder.css">
  <link rel="stylesheet" href="css/calculators.css">
  <link rel="stylesheet" href="css/light.css">
  <link rel="stylesheet" href="css/coach.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </span>
        <span class="brand-name">Pro Photo Toolkit</span>
        <span class="badge badge-outline">Prototype</span>
      </div>
      <nav class="tabs" id="page-tabs" role="tablist" aria-label="Page">
        <button class="tab" role="tab" data-page="app" aria-selected="true">App screens</button>
        <button class="tab" role="tab" data-page="library" aria-selected="false">Grid library</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="page page-app" id="page-app">
      <div class="stage">
        <div class="phone" aria-label="Phone preview">
          <div class="phone-notch" aria-hidden="true"></div>
          <div class="phone-screen dark" id="phone-screen">
            <div class="screen-body" id="screen-body"></div>
            <nav class="tabbar" id="tabbar" aria-label="App screens"></nav>
          </div>
        </div>
      </div>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </section>

    <section class="page page-library" id="page-library" hidden></section>
  </main>

  <script src="js/core.js"></script>
  <script src="js/data.js"></script>
  <script src="js/math.js"></script>
  <script src="js/grids.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/sun.js"></script>
  <script src="js/screens/viewfinder.js"></script>
  <script src="js/screens/calculators.js"></script>
  <script src="js/screens/light.js"></script>
  <script src="js/screens/coach.js"></script>
  <script src="js/screens/gear.js"></script>
  <script src="js/library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
